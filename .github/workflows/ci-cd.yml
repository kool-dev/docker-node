name: CI/CD
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - name: Check generated contexts and architecture selection
        run: |
          docker run --rm -v "$PWD:/app" fireworkweb/fwd:v1.0 fwd template
          git diff --exit-code
          bash tests/architecture.sh
      - id: tags
        run: |
          tags=$(jq -c '[.builds[].name] + ["24-nginx"]' fwd-template.json)
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
  build:
    needs: checks
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        version: ["22", "24", "26"]
        platform:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v7
      - uses: kool-dev/action/image-build@6a6d04e8d1e1c66afc178e32c7d77d76169c7717
        with:
          arch: ${{ matrix.platform.arch }}
      - name: Build fresh base
        id: base
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.version }}
          platforms: linux/${{ matrix.platform.arch }}
          pull: true
          load: true
          provenance: false
          tags: kooldev/node:${{ matrix.version }}
      - name: Test base
        env:
          IMAGE: ${{ steps.base.outputs.imageid }}
        run: bash tests/image.sh "$IMAGE"
      - name: Build nginx from this job's Node 24
        if: matrix.version == '24'
        id: nginx
        uses: docker/build-push-action@v7
        with:
          context: 24-nginx
          build-args: NODE_IMAGE=kooldev/node:24
          platforms: linux/${{ matrix.platform.arch }}
          load: true
          provenance: false
          tags: kooldev/node:24-nginx
      - uses: kool-dev/action/image-parent@6a6d04e8d1e1c66afc178e32c7d77d76169c7717
        if: matrix.version == '24'
        with:
          base-ref: kooldev/node:24
          base-id: ${{ steps.base.outputs.imageid }}
          image-id: ${{ steps.nginx.outputs.imageid }}
      - name: Test nginx
        if: matrix.version == '24'
        env:
          IMAGE: ${{ steps.nginx.outputs.imageid }}
        run: |
          bash tests/image.sh "$IMAGE"
          docker run --rm "$IMAGE" nginx -t
      - name: Collect tested IDs
        id: images
        env:
          VERSION: ${{ matrix.version }}
          BASE_ID: ${{ steps.base.outputs.imageid }}
          NGINX_ID: ${{ steps.nginx.outputs.imageid }}
        run: |
          images=$(jq -cn --arg version "$VERSION" --arg bid "$BASE_ID" --arg nid "$NGINX_ID" \
            '[{tag:$version,id:$bid}] + if $nid == "" then [] else [{tag:"24-nginx",id:$nid}] end')
          echo "images=$images" >> "$GITHUB_OUTPUT"
      - uses: kool-dev/action/image-stage@6a6d04e8d1e1c66afc178e32c7d77d76169c7717
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-node'
        with:
          canonical-repository: kool-dev/docker-node
          default-branch: master
          repository: kooldev/node
          arch: ${{ matrix.platform.arch }}
          group: ${{ matrix.version }}
          images: ${{ steps.images.outputs.images }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
  publish:
    needs: [checks, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-node'
    runs-on: ubuntu-24.04
    steps:
      - uses: kool-dev/action/image-publish@6a6d04e8d1e1c66afc178e32c7d77d76169c7717
        with:
          canonical-repository: kool-dev/docker-node
          default-branch: master
          repository: kooldev/node
          tags: ${{ needs.checks.outputs.tags }}
          architecture-aliases: true
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
