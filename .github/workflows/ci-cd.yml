name: CI/CD

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    strategy:
      matrix:
        version: [22, 24, 26]
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check generated contexts and architecture selection
        run: |
          python3 tests/generated.py
          sh tests/architecture.sh

      - name: Compute cache week
        id: cachekey
        run: echo "week=$(date -u +%Y-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: docker-buildx-${{ matrix.runs-on }}-${{ matrix.version }}-${{ steps.cachekey.outputs.week }}-${{ github.sha }}
          restore-keys: docker-buildx-${{ matrix.runs-on }}-${{ matrix.version }}-${{ steps.cachekey.outputs.week }}-

      - name: Build
        run: |
          docker buildx build \
            --pull \
            --cache-from type=local,src=/tmp/.buildx-cache/${{ matrix.version }} \
            --cache-to type=local,dest=/tmp/.buildx-cache/${{ matrix.version }} \
            --output type=docker \
            --tag "kooldev/node:${{ matrix.version }}-$(arch)" \
            ${{ matrix.version }}

      - name: Tests
        run: sh tests/image.sh "kooldev/node:${{ matrix.version }}-$(arch)"

      # Use the Docker engine's loaded, freshly tested parent, not yesterday's Hub tag.
      - name: Build and test nginx from this run's Node 24
        if: matrix.version == 24
        run: |
          docker build --builder default --pull=false \
            --build-arg "NODE_IMAGE=kooldev/node:24-$(arch)" \
            --tag "kooldev/node:24-nginx-$(arch)" 24-nginx
          sh tests/image.sh "kooldev/node:24-nginx-$(arch)"
          docker run --rm "kooldev/node:24-nginx-$(arch)" nginx -t

      - name: Login to DockerHub
        uses: docker/login-action@v3
        if: github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-node'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to DockerHub
        if: github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-node'
        run: |
          docker push "kooldev/node:${{ matrix.version }}-$(arch)"
          if [ "${{ matrix.version }}" = "24" ]; then
            docker push "kooldev/node:24-nginx-$(arch)"
          fi

  amend:
    if: github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-node'
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        version: [22, 24, 24-nginx, 26]

    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - run: |
          docker manifest create kooldev/node:${{ matrix.version }} \
            --amend kooldev/node:${{ matrix.version }}-x86_64 \
            --amend kooldev/node:${{ matrix.version }}-aarch64

          docker manifest push kooldev/node:${{ matrix.version }}
